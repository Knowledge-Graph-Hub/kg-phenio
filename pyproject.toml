[project]
name = "kg-phenio"
version = "0.1.1"
description = "A graph for accessing and comparing knowledge concerning phenotypes across species and genetic backgrounds."
license = "BSD-3-Clause"
authors = [
    { name = "caufieldjh", email = "j.harry.caufield@gmail.com" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "Sphinx>=5.2.3",
    "biolink-model>=4.2.0",
    "click>=8.1.3",
    "kgx>=2.7.0",
    "koza==1.0.0",
    "multi-indexer>=0.0.5",
    "pyyaml>=6.0.1",
    "sh>=1.14.3",
    "tqdm>=4.64.1",
    "universalizer>=0.0.11",
    "wget>=3.2",
    "numpy<2",
    "kghub-downloader>=0.4.2",
    # eutils (transitive via oaklib) does `import pkg_resources`, which
    # lives in setuptools. Pin <80 because setuptools 80+ removed
    # pkg_resources. (Poetry used to bundle setuptools implicitly; uv
    # doesn't, so declare it explicitly.)
    "setuptools<80",
    "kozahub-metadata-schema",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-cov>=4.0.0",
    "codacy-coverage>=1.3.11",
    "parameterized>=0.8.1",
    "ruff>=0.7",
]

[tool.uv.sources]
kozahub-metadata-schema = { git = "https://github.com/monarch-initiative/kozahub-metadata-schema.git", branch = "main" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I"]
ignore = ["E203"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg_phenio"]
