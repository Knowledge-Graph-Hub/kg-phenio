name: KG-PHENIO QC

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 3.12 dropped: tox.ini pins flake8 < 5.0.0 (2022-vintage) which
        # hits `AttributeError: 'EntryPoints' object has no attribute 'get'`
        # on the importlib_metadata changes in 3.12. Modernizing the lint
        # toolchain is a separate cleanup.
        python-version: ['3.10', '3.11']
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with flake8
        run: uv run tox -e flake8

      - name: Test with MyPy
        run: uv run tox -e mypy

      - name: Test with pytest
        run: uv run pytest
