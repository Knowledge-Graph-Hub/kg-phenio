; # Tox (http://tox.testrun.org/) is a tool for running tests
; # in multiple virtualenvs. This configuration file will run the
; # test suite on all supported python versions. To use it, "pip install tox"
; # and then run "tox" from this directory.
[tox]
envlist =
    lint
    ruff
    mypy
    py
isolated_build = True

[testenv]
whitelist_externals = poetry
commands =
    poetry run pytest
extras =
    test
description = Run unit tests with pytest. This is a special environment that does not get a name, and
              can be referenced with "py".

[testenv:lint]
skip_install = true
commands =
    black kg_phenio/ tests/
    isort kg_phenio/ tests/
deps =
    isort
    black
description = Run code formatters and linters.

[testenv:ruff]
skip_install = true
commands =
    ruff check kg_phenio/ tests/
deps =
    ruff>=0.7
description = Run the ruff code quality checker. Configuration lives in pyproject.toml [tool.ruff].

[testenv:mypy]
deps = mypy
skip_install = true
commands = mypy --install-types --non-interactive --ignore-missing-imports tests/
description = Run the mypy tool to check static typing on the project.